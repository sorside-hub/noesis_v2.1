<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Warna Tema & Mode Gelap Sistem -->
    <meta name="theme-color" content="#131313" />
    <meta name="color-scheme" content="dark" />
    
    <!-- PWA / iOS Tag -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Noesis" />
    <meta name="application-name" content="Noesis" />
    
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/pwa-512x512.png" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <title>Noesis v2 - Personal AI Assistant</title>
    
    <!-- Mencegah flash putih sebelum CSS/React dimuat -->
    <style>
      html, body {
        background-color: #131313;
        color: #ffffff;
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('SW registration failed: ', err);
          });
        });
      }
    </script>
  </body>
</html>
